name: Daily board

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build
        run: python board.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
          PROFILE_MD: ${{ secrets.PROFILE_MD }}
      - name: Save state
        run: |
          git config user.name "daily-board"
          git config user.email "daily-board@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
